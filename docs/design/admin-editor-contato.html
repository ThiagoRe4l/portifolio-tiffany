<!doctype html>
<!-- Referência visual exportada do Claude Design (canvas "Landing Page Psicóloga"). Não é código de produção. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Editor de contato</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#2F5D57}a:hover{color:#244A45}
input:focus,textarea:focus{outline:2px solid #2F5D57;outline-offset:1px;border-color:#2F5D57 !important}
</style>

<div style="position: relative; width: 390px; height: 1700px; box-sizing: border-box; display: flex; flex-direction: column; background: #FAF6F0; color: #1F2D2B; font-family: Inter, system-ui, sans-serif; font-size: 16px; line-height: 1.5;">

<header style="display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 12px 20px; background: #FFFFFF; border-bottom: 1px solid #E6DCCF;">
<div style="display: flex; flex-direction: column; line-height: 1.25;">
<span style="font-family: Fraunces, Georgia, serif; font-size: 20px; font-weight: 500;">Editar site</span>
<span style="font-size: 12px; color: #A9553A; font-weight: 500;">Alterações não salvas</span>
</div>
<div style="display: flex; gap: 4px;">
<a href="#" style="display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; border-radius: 10px; font-size: 14px; font-weight: 500; text-decoration: none;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>Ver site</a>
<button type="button" aria-label="Sair" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: #56625F;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 16l-4-4 4-4M6 12h10"></path></svg></button>
</div>
</header>

<nav aria-label="Seções do site" style="display: flex; flex-direction: column; gap: 6px; padding: 16px 20px; background: #FFFFFF; border-bottom: 1px solid #E6DCCF;">
<span style="font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #56625F;">Seção do site · 8 de 8</span>
<button type="button" aria-haspopup="listbox" aria-label="Escolher seção: Contato" style="display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 16px; border-radius: 12px; border: 1px solid #CFC3B4; background: #FAF6F0; color: #1F2D2B; font: inherit; font-weight: 600;">Contato<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
</nav>

<form style="display: flex; flex-direction: column; gap: 22px; padding: 24px 20px 120px;">
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="c-titulo" style="font-size: 14px; font-weight: 500;">Título</label>
<input id="c-titulo" type="text" value="Vamos conversar?" style="min-height: 52px; padding: 0 16px; border-radius: 12px; border: 1px solid #CFC3B4; background: #FFFFFF; font: inherit; color: #1F2D2B;">
</div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="c-texto" style="font-size: 14px; font-weight: 500;">Texto</label>
<textarea id="c-texto" rows="3" style="padding: 14px 16px; border-radius: 12px; border: 1px solid #CFC3B4; background: #FFFFFF; font: inherit; color: #1F2D2B; resize: vertical;">Tire suas dúvidas ou agende uma avaliação. Respondo pelo WhatsApp em [horário de resposta].</textarea>
</div>

<fieldset style="display: flex; flex-direction: column; gap: 16px; margin: 0; padding: 18px; border-radius: 16px; border: 1px solid #E6DCCF; background: #FFFFFF;">
<legend style="padding: 0 6px; font-size: 14px; font-weight: 600; color: #2F5D57;">WhatsApp</legend>
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="c-wpp" style="font-size: 14px; font-weight: 500;">Número com DDD</label>
<input id="c-wpp" type="tel" inputmode="tel" value="+55 [00] [00000-0000]" style="min-height: 52px; padding: 0 16px; border-radius: 12px; border: 1px solid #CFC3B4; background: #FAF6F0; font: inherit; color: #1F2D2B;">
</div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="c-msg" style="font-size: 14px; font-weight: 500;">Mensagem pronta</label>
<textarea id="c-msg" rows="3" style="padding: 14px 16px; border-radius: 12px; border: 1px solid #CFC3B4; background: #FAF6F0; font: inherit; color: #1F2D2B; resize: vertical;">Olá! Vim pelo site e gostaria de saber mais sobre o atendimento.</textarea>
<span style="font-size: 12px; color: #56625F;">Todos os botões de WhatsApp do site abrem a conversa com esse texto.</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="c-btn" style="font-size: 14px; font-weight: 500;">Texto do botão</label>
<input id="c-btn" type="text" value="Chamar no WhatsApp" style="min-height: 52px; padding: 0 16px; border-radius: 12px; border: 1px solid #CFC3B4; background: #FAF6F0; font: inherit; color: #1F2D2B;">
</div>
<label style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; font-size: 15px;">Mostrar botão flutuante
<input type="checkbox" checked="checked" style="width: 24px; height: 24px; accent-color: #2F5D57;">
</label>
</fieldset>

<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="c-insta" style="font-size: 14px; font-weight: 500;">Instagram</label>
<input id="c-insta" type="text" value="@[perfil]" style="min-height: 52px; padding: 0 16px; border-radius: 12px; border: 1px solid #CFC3B4; background: #FFFFFF; font: inherit; color: #1F2D2B;">
</div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="c-email" style="font-size: 14px; font-weight: 500;">E-mail</label>
<input id="c-email" type="email" value="[contato@seudominio.com.br]" style="min-height: 52px; padding: 0 16px; border-radius: 12px; border: 1px solid #CFC3B4; background: #FFFFFF; font: inherit; color: #1F2D2B;">
</div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="c-tel" style="font-size: 14px; font-weight: 500;">Telefone para ligação</label>
<input id="c-tel" type="tel" value="[(00) 00000-0000]" style="min-height: 52px; padding: 0 16px; border-radius: 12px; border: 1px solid #CFC3B4; background: #FFFFFF; font: inherit; color: #1F2D2B;">
</div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="c-end" style="font-size: 14px; font-weight: 500;">Endereço</label>
<input id="c-end" type="text" value="[Rua, número — Bairro, Cidade]" style="min-height: 52px; padding: 0 16px; border-radius: 12px; border: 1px solid #CFC3B4; background: #FFFFFF; font: inherit; color: #1F2D2B;">
</div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="c-hor" style="font-size: 14px; font-weight: 500;">Horários</label>
<input id="c-hor" type="text" value="[Seg a sex, 8h às 18h]" style="min-height: 52px; padding: 0 16px; border-radius: 12px; border: 1px solid #CFC3B4; background: #FFFFFF; font: inherit; color: #1F2D2B;">
</div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="c-mapa" style="font-size: 14px; font-weight: 500;">Link do Google Maps</label>
<input id="c-mapa" type="url" value="https://maps.app.goo.gl/[...]" style="min-height: 52px; padding: 0 16px; border-radius: 12px; border: 1px solid #CFC3B4; background: #FFFFFF; font: inherit; color: #1F2D2B;">
<span style="font-size: 12px; color: #56625F;">Deixe vazio para esconder o mapa.</span>
</div>
</form>

<div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 10px; padding: 14px 20px 22px; background: #FFFFFF; border-top: 1px solid #E6DCCF; box-shadow: 0 -6px 20px rgba(31,45,43,.06);">
<button type="button" style="flex: 1; min-height: 52px; border-radius: 999px; border: 1px solid #CFC3B4; background: #FFFFFF; color: #1F2D2B; font: inherit; font-weight: 500;">Descartar</button>
<button type="button" style="flex: 2; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border: 0; border-radius: 999px; background: #2F5D57; color: #FFFFFF; font: inherit; font-weight: 600;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Salvar e publicar</button>
</div>
</div>


</body>
</html>
