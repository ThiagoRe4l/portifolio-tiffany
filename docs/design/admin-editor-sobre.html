<!doctype html>
<!-- Referência visual exportada do Claude Design (canvas "Landing Page Psicóloga"). Não é código de produção. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Editor de conteúdo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#2F5D57}a:hover{color:#244A45}
input:focus,textarea:focus{outline:2px solid #2F5D57;outline-offset:1px;border-color:#2F5D57 !important}
</style>

<div style="position: relative; width: 390px; height: 1400px; box-sizing: border-box; display: flex; flex-direction: column; background: #FAF6F0; color: #1F2D2B; font-family: Inter, system-ui, sans-serif; font-size: 16px; line-height: 1.5;">

<header style="display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 12px 20px; background: #FFFFFF; border-bottom: 1px solid #E6DCCF;">
<div style="display: flex; flex-direction: column; line-height: 1.25;">
<span style="font-family: Fraunces, Georgia, serif; font-size: 20px; font-weight: 500;">Editar site</span>
<span style="font-size: 12px; color: #56625F;">Última publicação: [data]</span>
</div>
<div style="display: flex; gap: 4px;">
<a href="#" style="display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; border-radius: 10px; font-size: 14px; font-weight: 500; text-decoration: none;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>Ver site</a>
<button type="button" aria-label="Sair" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: #56625F;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 16l-4-4 4-4M6 12h10"></path></svg></button>
</div>
</header>

<nav aria-label="Seções do site" style="display: flex; flex-direction: column; gap: 6px; padding: 16px 20px; background: #FFFFFF; border-bottom: 1px solid #E6DCCF;">
<span style="font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #56625F;">Seção do site · 3 de 8</span>
<button type="button" aria-haspopup="listbox" aria-label="Escolher seção: Sobre mim" style="display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 16px; border-radius: 12px; border: 1px solid #CFC3B4; background: #FAF6F0; color: #1F2D2B; font: inherit; font-weight: 600;">Sobre mim<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
<span style="font-size: 12px; color: #56625F;">Geral · Início · Sobre mim · Meu trabalho · Área de atuação · Como funciona · O espaço · Contato</span>
</nav>

<form style="display: flex; flex-direction: column; gap: 22px; padding: 24px 20px 120px;">
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="etiqueta" style="font-size: 14px; font-weight: 500;">Etiqueta da seção</label>
<input id="etiqueta" type="text" value="Sobre mim" style="min-height: 52px; padding: 0 16px; border-radius: 12px; border: 1px solid #CFC3B4; background: #FFFFFF; font: inherit; color: #1F2D2B;">
<span style="font-size: 12px; color: #56625F;">O texto pequeno em terracota acima do título.</span>
</div>
<div style="display: flex; flex-direction: column; gap: 10px;">
<span style="font-size: 14px; font-weight: 500;">Foto da seção</span>
<div style="display: flex; gap: 14px; align-items: center; padding: 12px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E6DCCF;">
<div role="img" aria-label="Miniatura da foto atual" style="flex: none; width: 88px; height: 88px; border-radius: 12px; background: #E9DFD2;"></div>
<div style="display: flex; flex-direction: column; gap: 8px;">
<button type="button" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid #2F5D57; background: #FFFFFF; color: #2F5D57; font: inherit; font-size: 14px; font-weight: 600;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"></path></svg>Trocar foto</button>
<span style="font-size: 12px; color: #56625F;">JPG ou PNG · redimensionada automaticamente</span>
</div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="titulo" style="font-size: 14px; font-weight: 500;">Título</label>
<input id="titulo" type="text" value="Olá, eu sou a [Nome]." style="min-height: 52px; padding: 0 16px; border-radius: 12px; border: 1px solid #CFC3B4; background: #FFFFFF; font: inherit; color: #1F2D2B;">
</div>

<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="texto1" style="font-size: 14px; font-weight: 500;">Texto principal</label>
<textarea id="texto1" rows="6" style="padding: 14px 16px; border-radius: 12px; border: 1px solid #CFC3B4; background: #FFFFFF; font: inherit; color: #1F2D2B; resize: vertical;">Sou psicóloga e atuo em uma clínica especializada no atendimento de pessoas com Transtorno do Espectro Autista. Meu trabalho é guiado pela Análise do Comportamento…</textarea>
<span style="align-self: flex-end; font-size: 12px; color: #56625F;">182 / 600</span>
</div>

<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="texto2" style="font-size: 14px; font-weight: 500;">Texto complementar</label>
<textarea id="texto2" rows="3" style="padding: 14px 16px; border-radius: 12px; border: 1px solid #CFC3B4; background: #FFFFFF; font: inherit; color: #1F2D2B; resize: vertical;">Sigo estudando: curso pós-graduação em Análise do Comportamento aplicada ao TEA…</textarea>
</div>

<fieldset style="display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; border: 0;">
<legend style="margin-bottom: 10px; font-size: 14px; font-weight: 500;">Formação</legend>
<div style="display: flex; gap: 8px;">
<input aria-label="Item de formação 1" type="text" value="Graduação em Psicologia — [Instituição, ano]" style="flex: 1; min-width: 0; min-height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #CFC3B4; background: #FFFFFF; font: inherit; font-size: 15px; color: #1F2D2B;">
<button type="button" aria-label="Remover item 1" style="flex: none; display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; border: 1px solid #E6DCCF; border-radius: 12px; background: #FFFFFF; color: #56625F;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg></button>
</div>
<div style="display: flex; gap: 8px;">
<input aria-label="Item de formação 2" type="text" value="Pós em Análise do Comportamento aplicada ao TEA — em andamento" style="flex: 1; min-width: 0; min-height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #CFC3B4; background: #FFFFFF; font: inherit; font-size: 15px; color: #1F2D2B;">
<button type="button" aria-label="Remover item 2" style="flex: none; display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; border: 1px solid #E6DCCF; border-radius: 12px; background: #FFFFFF; color: #56625F;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg></button>
</div>
<button type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border: 1.5px dashed #CFC3B4; border-radius: 12px; background: transparent; color: #2F5D57; font: inherit; font-size: 14px; font-weight: 600;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Adicionar item</button>
</fieldset>
</form>

<div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 10px; padding: 14px 20px 22px; background: #FFFFFF; border-top: 1px solid #E6DCCF; box-shadow: 0 -6px 20px rgba(31,45,43,.06);">
<button type="button" style="flex: 1; min-height: 52px; border-radius: 999px; border: 1px solid #CFC3B4; background: #FFFFFF; color: #1F2D2B; font: inherit; font-weight: 500;">Descartar</button>
<button type="button" style="flex: 2; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border: 0; border-radius: 999px; background: #2F5D57; color: #FFFFFF; font: inherit; font-weight: 600;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Salvar e publicar</button>
</div>
</div>


</body>
</html>
