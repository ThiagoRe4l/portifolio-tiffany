<!doctype html>
<!-- Referência visual exportada do Claude Design (canvas "Landing Page Psicóloga"). Não é código de produção. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Login administrativo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#2F5D57}a:hover{color:#244A45}
input:focus{outline:2px solid #2F5D57;outline-offset:1px;border-color:#2F5D57 !important}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; padding: 32px 24px; background: #FAF6F0; color: #1F2D2B; font-family: Inter, system-ui, sans-serif; font-size: 16px; line-height: 1.5;">
<a href="#" style="display: flex; align-items: center; gap: 6px; min-height: 44px; color: #56625F; font-size: 14px; text-decoration: none;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>Voltar ao site</a>
<div style="display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 56px; text-align: center;">
<span style="display: flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: 999px; background: #2F5D57; color: #FFFFFF; font-family: Fraunces, Georgia, serif; font-size: 22px;">NS</span>
<h1 style="margin: 8px 0 0; font-family: Fraunces, Georgia, serif; font-size: 28px; font-weight: 500;">Área administrativa</h1>
<p style="margin: 0; color: #56625F;">Entre para editar textos e fotos do site.</p>
</div>
<form style="display: flex; flex-direction: column; gap: 18px; margin-top: 40px;">
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="email" style="font-size: 14px; font-weight: 500;">E-mail</label>
<input id="email" type="email" autocomplete="email" placeholder="voce@email.com" style="min-height: 52px; padding: 0 16px; border-radius: 12px; border: 1px solid #CFC3B4; background: #FFFFFF; font: inherit; color: #1F2D2B;">
</div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="senha" style="font-size: 14px; font-weight: 500;">Senha</label>
<div style="position: relative; display: flex;">
<input id="senha" type="password" autocomplete="current-password" value="••••••••" style="flex: 1; min-height: 52px; padding: 0 52px 0 16px; border-radius: 12px; border: 1px solid #CFC3B4; background: #FFFFFF; font: inherit; color: #1F2D2B;">
<button type="button" aria-label="Mostrar senha" style="position: absolute; right: 4px; top: 4px; display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: #56625F;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
</div>
</div>
<button type="submit" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; margin-top: 8px; border: 0; border-radius: 999px; background: #2F5D57; color: #FFFFFF; font: inherit; font-weight: 600;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>Entrar</button>
<a href="#" style="align-self: center; display: flex; align-items: center; min-height: 44px; font-size: 14px;">Esqueci minha senha</a>
</form>
<p style="margin: auto 0 0; padding: 14px 16px; border-radius: 12px; background: #F1E8DC; color: #56625F; font-size: 13px; text-align: center;">Acesso exclusivo da administradora do site.</p>
</div>


</body>
</html>
