name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Um push novo no mesmo branch cancela a execução anterior ainda em andamento.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Testes (Vitest)
        run: npm run test

      - name: Build
        run: npm run build

      - name: Orçamento de bundle
        run: npm run size

  e2e:
    name: E2E (mobile primeiro) + acessibilidade
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar navegadores do Playwright
        run: npx playwright install --with-deps chromium webkit

      - name: Testes E2E (Playwright + axe)
        run: npm run test:e2e

      - name: Enviar relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
