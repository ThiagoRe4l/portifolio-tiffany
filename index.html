<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FAF6F0" />
    <!-- Spec 002 (plan D1): animações só escondem conteúdo depois desta marca; 3 s de trava. -->
    <!-- prettier-ignore -->
    <script>(function(d){d.setAttribute('data-motion','pending');setTimeout(function(){if(d.getAttribute('data-motion')!=='ready')d.removeAttribute('data-motion')},3000)})(document.documentElement)</script>
    <link
      rel="preload"
      href="/fonts/inter-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/fraunces-latin-500-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <!--app-data-->
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
